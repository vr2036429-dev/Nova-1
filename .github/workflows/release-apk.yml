name: ULTRON Zero-Setup Android APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Compute dynamic version string (v1.0.<run_number>)
      - name: Compute Build Version
        id: versioning
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          CLEAN_VERSION="1.0.${{ github.run_number }}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Starting ZERO-SETUP build for ULTRON: ${VERSION_TAG}"

      # 3. Setup Node.js 20 environment with caching
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 4. Setup Java JDK 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Gradle Caching for fast builds
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 6. Install Project Dependencies
      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      # 7. Optional Gemini API Key injection from Secrets (if provided, otherwise fallback to in-app settings)
      - name: Configure Production Environment
        env:
          OPTIONAL_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "VITE_APP_VERSION=${{ steps.versioning.outputs.clean_version }}" > .env.production
          if [ -n "$OPTIONAL_GEMINI_KEY" ]; then
            echo "VITE_GEMINI_API_KEY=${OPTIONAL_GEMINI_KEY}" >> .env.production
            echo "GEMINI_API_KEY=${OPTIONAL_GEMINI_KEY}" >> .env.production
          fi

      # 8. Build Web Application Assets with Vite
      - name: Build Web Assets (Vite)
        run: |
          npx vite build

      # 9. Sync & Initialize Capacitor Android Project
      - name: Setup & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Capacitor Android project..."
            npx cap add android
          fi

          # Ensure AndroidManifest permissions are patched
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Injecting Android permissions into AndroidManifest.xml..."
            PERMISSIONS='
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.FLASHLIGHT" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />'

            # Insert permissions right after <manifest ...> if not already present
            if ! grep -q "RECORD_AUDIO" "$MANIFEST_PATH"; then
              sed -i "/<manifest/a $PERMISSIONS" "$MANIFEST_PATH"
            fi
          fi

          npx cap sync android

      # 10. ZERO-SETUP Auto-Generate Production Keystore on the fly (No Secrets Required!)
      - name: Auto-Generate Android Keystore
        run: |
          mkdir -p android/app
          
          # If custom secret provided, use it, else generate on the fly
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "Using custom keystore from repository secrets."
          else
            echo "Generating self-contained release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias ultron \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ultron123 \
              -keypass ultron123 \
              -dname "CN=ULTRON, OU=AI, O=Jarvis, L=Global, S=Core, C=US"
            echo "Auto-generated release keystore ready at android/app/release.keystore"
          fi

      # 11. Ensure Gradle build.gradle includes zero-setup signing fallback
      - name: Configure build.gradle Signing Config
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            # Ensure release signing config is wired to release.keystore
            if ! grep -q "release.keystore" "$BUILD_GRADLE"; then
              python3 -c '
path = "android/app/build.gradle"
with open(path, "r") as f:
    content = f.read()

signing_snippet = """
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "ultron123"
            keyAlias System.getenv("KEY_ALIAS") ?: "ultron"
            keyPassword System.getenv("KEY_PASSWORD") ?: "ultron123"
        }
    }
"""

if "signingConfigs {" not in content:
    content = content.replace("android {", "android {\n" + signing_snippet)
if "signingConfig signingConfigs.release" not in content:
    content = content.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }")

with open(path, "w") as f:
    f.write(content)
'
            fi
          fi

      # 12. Ensure gradlew is executable
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # 13. Build Signed Release APK with Gradle
      - name: Build Release APK
        env:
          APP_VERSION_NAME: ${{ steps.versioning.outputs.clean_version }}
          APP_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ultron123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ultron' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ultron123' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # 14. Locate, Verify and Rename Release APK
      - name: Package Final APK
        id: apk_step
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*release*.apk" -o -name "*unsigned*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK could not be found!"
            exit 1
          fi
          
          FINAL_NAME="ULTRON-${{ steps.versioning.outputs.tag }}.apk"
          cp "$APK_PATH" "$FINAL_NAME"
          echo "apk_file=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "Generated signed APK: $FINAL_NAME ($(du -h "$FINAL_NAME" | cut -f1))"

      # 15. Create Automatic GitHub Tag & Release with APK Attached
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "ULTRON ${{ steps.versioning.outputs.tag }}"
          files: ${{ steps.apk_step.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🤖 ULTRON Jarvis Android Assistant
            
            **Release**: `${{ steps.versioning.outputs.tag }}` (Build #${{ steps.versioning.outputs.version_code }})
            
            #### 📦 Android Package
            - **Download Signed APK**: [`${{ steps.apk_step.outputs.apk_file }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.tag }}/${{ steps.apk_step.outputs.apk_file }})
            
            #### ⚡ Highlights
            - 🎙️ Multi-Layer Owner Voice Authentication (ASIK) & Anti-Spoof Engine
            - 🌐 Seamless touch gesture tab cycling & continuous speech interaction
            - 📱 Device integrations (Torch, Vibration, Screen Reader, Android Settings)
            - 🔑 In-app Gemini API Key configuration supported (Settings -> API Key)
            
            ---
            *Zero-Setup automatic build generated on code push to `${{ github.ref_name }}`.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
